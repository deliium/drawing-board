services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: drawing-board-backend
    # Backend stays on the internal compose network only. Reach it via the frontend
    # Nginx proxy (/api, /ws) or `docker compose exec backend …`.
    expose:
      - "8080"
    environment:
      - ADDR=:8080
      - DB_PATH=/data/drawing-board.db
      - APP_ENV=production
      # Placeholder is a blocked production sentinel — replace before deploy or the process exits.
      - COOKIE_KEY=replace-me-with-a-long-random-cookie-key
      # Browser-facing origin. Local HTTP compose demos use http://localhost;
      # real deployments MUST set https://your.public.origin (Secure cookies need HTTPS).
      - ALLOWED_ORIGINS=http://localhost
    volumes:
      - backend_data:/data
    networks:
      - drawing-board-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: drawing-board-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - drawing-board-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  backend_data:
    driver: local

networks:
  drawing-board-network:
    driver: bridge
