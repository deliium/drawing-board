# Small golangci-lint set — avoid vanity rule floods.
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
  settings:
    # govet uses defaults (do not enable-all — that pulls in fieldalignment/shadow vanity floods).
    # Keep SA/S/U analysis; drop style (ST*) and quickfix (QF*) vanity.
    staticcheck:
      checks:
        - "all"
        - "-ST*"
        - "-QF*"

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
